# SPDX-License-Identifier: Apache-2.0
#
# Model-based fuzzing of the Sentinel program in LiteSVM, next to Token-2022 v11.1. Separate from
# the program's workspace: it loads the built `sentinel.so`, not the crate, so it shares no
# dependencies with the program. `cargo test` here; see README.md.
[package]
name = "sentinel-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
rust-version = "1.89"

[workspace]
resolver = "3"

[dev-dependencies]
litesvm = "=0.16.0"
solana-account = "4.3.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-address = "~2.6.1"
solana-instruction = "~3.4.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-transaction-error = "~3.3.1"
solana-instruction-error = "~2.4.0"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
spl-token-2022-interface = "3.1.2"
sha2 = "0.10"

[features]
# Record a trace of every instruction Sentinel executes, for line coverage (see README.md).
coverage = ["litesvm/register-tracing"]

# LiteSVM and the Solana runtime are slow unoptimized; the test code itself stays debuggable.
[profile.dev.package."*"]
opt-level = 2
