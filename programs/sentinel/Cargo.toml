[package]
name = "sentinel"
version = "2.0.2"
description = "Programmable compliance for Token-2022 tokenized assets, built on Transfer Hooks."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sentinel"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.0"
anchor-spl = { version = "0.31.0", features = ["token_2022"] }
spl-transfer-hook-interface = "0.9.0"
spl-tlv-account-resolution = "0.9.0"

# Anchor's `#[program]` and `#[derive(Accounts)]` macros expand to code guarded by cfgs that exist
# only in the SBF build (`target_os = "solana"`) or as Anchor's own opt-in features. On a host-target
# clippy run those read as unknown cfgs. They are declared here rather than blanket-allowed, so a
# genuinely misspelled cfg in this crate still fails the lint.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))',
] }
# anchor-lang 0.31.1's `#[program]` expansion calls the deprecated `AccountInfo::realloc`. No code in
# this crate does. Remove this once Anchor's generated code moves to `AccountInfo::resize`.
deprecated = "allow"
